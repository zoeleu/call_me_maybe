[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small LLM via constrained decoding"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy",
    "pydantic>=2",
    "llm-sdk",
]

[project.optional-dependencies]
cpu = ["llm-sdk[cpu]"]  # default: no usable GPU
gfx1200 = ["llm-sdk[gfx1200]"]  # RX 9060 XT
gfx1034 = ["llm-sdk[gfx1034]"]  # RX 6500 (42 computers)

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

# uv only reads indexes from the root project. The ROCm wheels (torch, triton,
# rocm-sdk-*) are on the AMD index, so it is added next to PyPI, and
# unsafe-best-match lets uv pick across both instead of stopping at the first
# index that has the name.
[tool.uv]
index-strategy = "unsafe-best-match"
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gfx1200" },
        { extra = "gfx1034" },
    ],
    [
        { package = "llm-sdk", extra = "cpu" },
        { package = "llm-sdk", extra = "gfx1200" },
        { package = "llm-sdk", extra = "gfx1034" },
    ],
]

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"

# CPU-only torch. explicit: only used for packages that name it in
# tool.uv.sources (torch, with the cpu extra), so it never shadows PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.mypy]
exclude = ["llm_sdk/", "\\.venv/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
