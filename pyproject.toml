[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small LLM via constrained decoding"
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy",
    "pydantic>=2",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

# CPU-only build of torch, from PyTorch's own index (PyPI's Linux wheel pulls
# several GB of NVIDIA libraries that a CPU run never uses). uv only reads
# indexes from the root project, so it is declared here and named by
# llm_sdk's tool.uv.sources. explicit: only torch uses it, it never shadows
# PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.mypy]
exclude = ["llm_sdk/", "moulinette/", "\\.venv/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
